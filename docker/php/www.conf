; PHP-FPM Pool Configuration
; Docker - ShopCotachFouad

[www]
user = www-data
group = www-data

; Socket configuration
listen = 0.0.0.0:9000

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Status page
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Logging
access.log = /var/log/php-fpm-access.log
access.format = "%{REMOTE_ADDR} - %{user} [%{time_local}] \"%{method} %{path_with_query}\" %{response_code} %{content_length} \"%{php_value:HTTP_USER_AGENT}\" %{request_time}"
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s

; Security
security.limit_extensions = .php

; Environment variables
clear_env = no

; Timeout
request_terminate_timeout = 300s

;rlimit
rlimit_core = 0
rlimit_nofile = 131072

; Chroot
; chroot = /var/www/html

; Worker
php_admin_value[error_log] = /var/log/php-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[max_input_vars] = 3000
php_admin_value[date.timezone] = Africa/Algiers
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /var/www/html/storage/framework/sessions
php_admin_value[session.gc_maxlifetime] = 120
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.fast_shutdown] = 1
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600

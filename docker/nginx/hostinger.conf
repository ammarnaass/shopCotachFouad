# Nginx Configuration for Hostinger / Shared Hosting
# ShopCotachFouad - Laravel

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml;

# Main location
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Favicon and robots
location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Deny access to hidden files
location ~ /\.(?!well-known).* {
    deny all;
}

# Static files cache
location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|woff|woff2|ttf|svg|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    access_log off;
}

# PHP-FPM configuration
location ~ \.php$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Deny access to composer files
location ~ (composer\.(json|lock)|composer\.phar) {
    deny all;
}

# Deny access to environment files
location ~ /\.env {
    deny all;
}

# Deny access to storage config
location ~ storage/(logs|framework/(sessions|views|cache)) {
    deny all;
}

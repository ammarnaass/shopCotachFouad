services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: shopcotachfouad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - shopcotachfouad_network

  # Laravel PHP-FPM Application
  app:
    image: php:8.3-fpm
    container_name: shopcotachfouad-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=shopcotachfouad
      - DB_USERNAME=shop
      - DB_PASSWORD=shop_pass_2026
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - shopcotachfouad_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: shopcotachfouad-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2026
      MYSQL_DATABASE: shopcotachfouad
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop_pass_2026
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass_2026"]
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - shopcotachfouad_network

  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: shopcotachfouad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10
    networks:
      - shopcotachfouad_network

volumes:
  mysql_data:
  redis_data:

networks:
  shopcotachfouad_network:
    driver: bridge

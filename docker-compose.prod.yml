services:
  # Nginx Web Server (Production)
  nginx:
    image: nginx:alpine
    container_name: shopcotachfouad-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - shopcotachfouad_network

  # Laravel PHP-FPM Application (Production)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopcotachfouad-app
    restart: always
    volumes:
      - .:/var/www/html
      - app_logs:/var/www/html/storage/logs
      - app_storage:/var/www/html/storage/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=shopcotachfouad
      - DB_USERNAME=shop
      - DB_PASSWORD=shop_pass_2026
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopcotachfouad_network
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      timeout: 10s
      retries: 3
      start_period: 30s

  # MySQL Database (Production)
  mysql:
    image: mysql:8.0
    container_name: shopcotachfouad-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_2026}
      MYSQL_DATABASE: shopcotachfouad
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${DB_PASSWORD:-shop_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass_2026}"]
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - shopcotachfouad_network

  # Redis Cache (Production)
  redis:
    image: redis:7.4-alpine
    container_name: shopcotachfouad-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10
    networks:
      - shopcotachfouad_network

  # Queue Worker (Production)
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopcotachfouad-queue
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - app_logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=shopcotachfouad
      - DB_USERNAME=shop
      - DB_PASSWORD=shop_pass_2026
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
      - QUEUE_CONNECTION=database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopcotachfouad_network

  # Scheduler (Production)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopcotachfouad-scheduler
    restart: always
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - .:/var/www/html
      - app_logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=shopcotachfouad
      - DB_USERNAME=shop
      - DB_PASSWORD=shop_pass_2026
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
      - QUEUE_CONNECTION=database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopcotachfouad_network

volumes:
  mysql_data:
  redis_data:
  nginx_logs:
  app_logs:
  app_storage:

networks:
  shopcotachfouad_network:
    driver: bridge
